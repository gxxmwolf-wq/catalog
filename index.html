<!DOCTYPE html>
<html lang="ru">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RXDE.online — сервис доставки лекарств из Германии</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>
<div class="cont">
        <div class="sticky">
    <div class="top-menu-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #fff; border-bottom: 1px solid #f0f0f0;">
        
        <div style="display: flex; gap: 15px; font-weight: 700; font-size: 13px; color: var(--p);">
            <div class="tm-item" onclick="showInfo('faq')" style="cursor: pointer;">FAQ</div>
            <div class="tm-item" onclick="openQuestion()" style="cursor: pointer;">ВОПРОС</div>
            <div class="tm-item" onclick="showInfo('exp')" style="cursor: pointer;">ОПЫТ</div>
        </div>

        <div class="rates-compact" style="font-size: 11px; color: #999; text-align: right; line-height: 1.2; min-width: 70px;">
            <div style="white-space: nowrap;">ЦБ: <span id="cbrRate" style="color:#333; font-weight:600">0</span></div>
            <div style="white-space: nowrap;">Расчётный: <span id="finalRate" style="color:#000; font-weight:700">0</span></div>
        </div>
    </div>

    <div class="inp-wrap">
        <div class="embedded-logo" onclick="handleLogoClick()">
            <span class="rx-part">RX</span><span class="de-part">DE</span>
        </div>
        <input type="text" id="search" class="search-input" placeholder="Поиск (рус / lat)..." oninput="handleInput()" onkeydown="checkEnter(event)" autocomplete="off">
        <span class="cls-btn" id="clearBtn" onclick="clearSearch()" style="display:none">✕</span>
    </div>

    <div id="suggestRow" class="suggestions-row"></div>
</div>
    <div id="list"></div>
    <div id="introBlock" class="intro-section">
        <h2>Deutsche Qualität.</h2>
        <p>Введите название препарата в поиске выше.</p>
    </div>
</div>

<div id="miniCart" class="mini-cart-fab" onclick="openCart()">
    <div id="miniReceipt" class="mini-receipt" onclick="event.stopPropagation(); openCart()"></div>
    <div class="mini-cart-badge" id="miniCount">0</div>
    <div class="mini-cart-icon">🛒</div>
    <div class="mini-cart-total" id="miniPrice">0 €</div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="m-box" onclick="event.stopPropagation()">
        <div class="modal-head">
    <div style="display: flex; flex-direction: column; width: 100%;">
        <div id="modalOrderId" style="font-size: 10px; color: #999; font-weight: 400; text-transform: uppercase;">Заказ: ...</div>
        <div style="font-size: 11px; color: #000; font-weight: 400;">Расчётный: <span id="cartRate" style="font-weight:700">0</span> ₽</div>
    </div>
    <div onclick="closeModal()" class="close-x">✕</div>
</div>
        <div class="m-scroll-area" style="padding: 0 20px; flex: 1; overflow-y: auto;">
    <div id="cartItems"></div>
</div>
        
        <div class="modal-footer-sticky">
            <div class="footer-total-compact" style="margin-bottom: 15px;">
                <span>Итого к оплате:</span>
                <span id="footerTotalSum" style="color:var(--p); font-weight: 900;">0 €</span>
            </div>
            
            <div class="grid-3-btns">
                <button class="b-cell wa" onclick="currentPreparedText = getOrderTextAndLink().text; submitFinal('wa')"><span>WhatsApp</span></button>
                <button class="b-cell tg" onclick="currentPreparedText = getOrderTextAndLink().text; submitFinal('tg')"><span>Telegram</span></button>
                <button class="b-cell other" onclick="currentPreparedText = getOrderTextAndLink().text; openContactForm(currentPreparedText)"><span>Другое</span></button>
            </div>
        </div>
    </div>
</div>

<div id="infoOverlay" class="info-overlay" onclick="closeInfo()">
    <div class="info-box" onclick="event.stopPropagation()">
        <div id="infoTitle" class="info-title"></div>
        <div id="infoContent" class="info-content"></div>
        <button onclick="closeInfo()" class="s-close-btn" style="margin-top:20px">ПОНЯТНО</button>
    </div>
</div>

<div id="contactOverlay" class="info-overlay" onclick="closeContact()">
    <div class="info-box contact-box" onclick="event.stopPropagation()">
        <div id="contactTitle" class="info-title">СВЯЗАТЬСЯ</div>
        <textarea id="manualMsgInput" class="universal-textarea" placeholder="Ваш вопрос..." style="display:none"></textarea>
        <input type="text" id="contactDetailsInput" class="cp-input-inline" placeholder="Ваш телефон или ник..." oninput="checkInputState()" style="width:100%; margin-bottom:15px; box-sizing:border-box; display:none">
        <div id="contactButtonsGrid" class="grid-3-btns">
            <button class="b-cell wa" onclick="submitFinal('wa')"><span>WhatsApp</span></button>
            <button class="b-cell tg" onclick="submitFinal('tg')"><span>Telegram</span></button>
            <button class="b-cell other" onclick="switchToContactForm()"><span>Другое</span></button>
        </div>
        <button id="btnOtherSend" class="cp-submit-full" onclick="submitFinal('other')" style="display:none" disabled>ОТПРАВИТЬ</button>
        <button onclick="closeContact()" class="s-close-btn" style="background:none; color:#888; margin-top:15px;">ОТМЕНА</button>
    </div>
</div>

<div id="successPopup" class="success-popup">
    <div class="s-head-icon">✅</div>
    <div class="s-title">Запрос принят!</div>
    <div id="succID" class="s-order-id">#0000</div>
    <button onclick="closeSuccess()" class="s-close-btn">ЗАКРЫТЬ</button>
</div>
<script>
    /* =========================================
   BLOCK 1: ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
   ========================================= */
const LOCAL_DB_URL = 'db.csv'; 
const GOOGLE_SETTINGS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTh9jBKA_RFbB03wt7VljCrZqxM9wBq9aGadw1uHCD4PQ5z5K3YoiF1bkxabc1kzPtP6tA6FLOxOB6b/pub?gid=23735297&single=true&output=csv';
const CBR_API_URL = 'https://www.cbr-xml-daily.ru/daily_json.js';
const KURS_FALLBACK = 100, TG_USER = 'remed01', WA_PHONE = '79650302556';

let db = [], cart = [], rateCalc = 100, shipEur = 50, filters = { search: '' };
let currentPreparedText = ""; // ОБЪЯВЛЕНО ОДИН РАЗ
let contactMode = 'question';
let cbrRateData = 0, googleSettings = null; // Добавили недостающие переменные
let restoredDate = ""; // Флаг для хранения даты восстановления

const audioAdd = new Audio("sounds/add.mp3");
    const audioRem = new Audio("sounds/remove.mp3");
    
    function playSound(isRemoving) {
        const snd = isRemoving ? audioRem : audioAdd;
        snd.currentTime = 0;
        snd.volume = 0.4;
        snd.play().catch(e => console.log("Sound blocked by browser"));
    }

    /* =========================================
       BLOCK 2: УНИВЕРСАЛЬНАЯ ЛОГИКА СВЯЗИ
       ========================================= */
    
    function openQuestion() {
        const overlay = document.getElementById('contactOverlay');
        document.getElementById('contactTitle').innerText = "ВАШ ВОПРОС";
        document.getElementById('manualMsgInput').style.display = 'block';
        document.getElementById('manualMsgInput').value = "Здравствуйте RxDE, у меня вопрос: ";
        document.getElementById('contactDetailsInput').style.display = 'none';
        document.getElementById('contactButtonsGrid').style.display = 'grid';
        document.getElementById('btnOtherSend').style.display = 'none';
        overlay.style.display = 'flex';
        setTimeout(() => document.getElementById('manualMsgInput').focus(), 100);
    }

    function openContactForm(preparedText) {
        currentPreparedText = preparedText;
        switchToContactForm();
        document.getElementById('contactOverlay').style.display = 'flex';
    }

    function switchToContactForm() {
        document.getElementById('contactTitle').innerText = "ОСТАВИТЬ КОНТАКТ";
        document.getElementById('manualMsgInput').style.display = 'none';
        document.getElementById('contactDetailsInput').style.display = 'block';
        document.getElementById('contactButtonsGrid').style.display = 'none';
        document.getElementById('btnOtherSend').style.display = 'block';
        setTimeout(() => document.getElementById('contactDetailsInput').focus(), 100);
    }

    function submitFinal(app) {
        const manualInput = document.getElementById('manualMsgInput');
        const contactInput = document.getElementById('contactDetailsInput');
        let finalMsg = "";

        if (manualInput.style.display !== 'none') {
            finalMsg = manualInput.value.trim();
        } else if (contactInput.style.display !== 'none') {
            finalMsg = currentPreparedText + "\n\nКонтакт: " + contactInput.value.trim();
        } else {
            finalMsg = currentPreparedText;
        }

        if (app === 'wa') {
            window.open(`https://wa.me/${WA_PHONE}?text=${encodeURIComponent(finalMsg)}`, '_blank');
        } else if (app === 'tg') {
            try { navigator.clipboard.writeText(finalMsg); } catch(e){}
            window.open(`https://t.me/${TG_USER}`, '_blank');
        } else {
            showSuccess(generateOrderID(), contactInput.value.trim());
        }
        closeContact();
    }
    
    // Удалите старые копии handleUniversalSubmit и let currentPreparedText ниже по коду!

    function closeContact() {
        const overlay = document.getElementById('contactOverlay');
        if (overlay) overlay.style.display = 'none';
    }

    function checkInputState() {
        const val = document.getElementById('contactDetailsInput').value.trim();
        document.getElementById('btnOtherSend').disabled = val.length < 3;
    }

   /* =========================================
       BLOCK 3: ДАННЫЕ, КУРСЫ И УМНЫЙ ПОИСК
       ========================================= */

    // --- 1. ЗАГРУЗКА ДАННЫХ (НОВОЕ) ---

    async function fetchCbrRate() {
        try {
            const response = await fetch(CBR_API_URL);
            const data = await response.json();
            cbrRateData = data.Valute.EUR.Value;
        } catch (e) {
            console.log("CBR error, fallback used");
            cbrRateData = KURS_FALLBACK;
        }
    }

    async function fetchGoogleSettings() {
        return new Promise(resolve => {
            Papa.parse(GOOGLE_SETTINGS_URL + '&t=' + Date.now(), {
                download: true,
                header: true,
                complete: res => {
                    googleSettings = res.data ? res.data[0] : null;
                    resolve();
                },
                error: () => resolve()
            });
        });
    }

    // --- 2. ЛОГИКА КУРСА (ОБНОВЛЕНО) ---

    function calculateFinalLogic() {
    // Если база еще не приехала, не считаем
    if (!db || db.length === 0) return;

    let gRate = parseFloat(googleSettings?.Current_Rate?.replace(',', '.') || 0);
    let gSmena = parseFloat(googleSettings?.Bank_Smena?.replace(',', '.') || 0);
    
    // Прямая проверка: если есть данные от Google или ЦБ — берем их. Если всё по нулям — тогда 100.
    let baseRate = gRate > 0 ? gRate : (cbrRateData > 0 ? cbrRateData : KURS_FALLBACK);
    
    rateCalc = Math.floor(baseRate + gSmena); 

    // Выводим в шапку (Главный экран)
    // Стало (показывает baseRate - а он у нас берется из Гугла, если Гугл загрузился):
    if(document.getElementById('cbrRate')) document.getElementById('cbrRate').innerText = baseRate.toFixed(2);
    if(document.getElementById('finalRate')) document.getElementById('finalRate').innerText = rateCalc; 
    
    // Выводим в корзину (Модальное окно)
    if(document.getElementById('cartRate')) document.getElementById('cartRate').innerText = rateCalc.toLocaleString('ru-RU');
    
    updateBar();
    render(); 
}

    function getRubPrice(eur) { return Math.floor((parseFloat(eur) * rateCalc) / 100) * 100; }

    // --- 3. ИНФО-ОКНА (FAQ / ОПЫТ) ---

    function showInfo(type) {
        const overlay = document.getElementById('infoOverlay');
        if (!overlay || type === 'none' || !type) { 
            if(overlay) overlay.style.display = 'none'; 
            return; 
        }
        
        const data = {
            faq: { 
                t: 'Частые вопросы', 
                c: '• Доставка: 14-21 день из Германии.<br>• Гарантии: Оригинальные чеки аптек.<br>• Оплата: СБП, QR, карты РФ.' 
            },
            exp: { 
                t: 'Наш опыт', 
                c: '• 5 лет работы на рынке.<br>• 10,000+ доставленных заказов.<br>• Прямые закупки в аптеках Берлина.' 
            }
        };
        if (!data[type]) return;
        document.getElementById('infoTitle').innerText = data[type].t;
        document.getElementById('infoContent').innerHTML = data[type].c;
        overlay.style.display = 'flex';
    }

    function closeInfo() { document.getElementById('infoOverlay').style.display = 'none'; }

    window.onclick = function(event) {
        const modal = document.getElementById('modal');
        const info = document.getElementById('infoOverlay');
        const contact = document.getElementById('contactOverlay');
        if (event.target == modal) closeModal();
        if (event.target == info) closeInfo();
        if (event.target == contact) closeContact();
    }

    // --- 4. УМНЫЙ ПОИСК (ТВОЯ ЛОГИКА БЕЗ ИЗМЕНЕНИЙ) ---

    function getSearchVariations(word) {
        const w = word.toLowerCase();
        const ru2en = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya' };
        const en2ru = { 'a':'а','b':'б','v':'в','g':'г','d':'д','e':'е','z':'з','i':'и','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','r':'р','s':'с','t':'т','u':'у','f':'ф','h':'х','c':'ц','y':'ы','x':'х','w':'в' }; 
        const layEn = "qwertyuiop[]asdfghjkl;'zxcvbnm,.`", layRu = "йцукенгшщзхъфывапролджэячсмитьбюё";
        let resTranslit = '', resLayout = '';
        for(let i = 0; i < w.length; i++) {
            const char = w[i];
            if (ru2en[char]) resTranslit += ru2en[char];
            else if (en2ru[char]) resTranslit += en2ru[char];
            else resTranslit += char;
            const idxEn = layEn.indexOf(char), idxRu = layRu.indexOf(char);
            if (idxEn !== -1) resLayout += layRu[idxEn];
            else if (idxRu !== -1) resLayout += layEn[idxRu];
            else resLayout += char;
        }
        return [w, resTranslit, resLayout];
    }

    function checkEnter(e) { if (e.key === 'Enter') document.getElementById('search').blur(); }

    function handleInput(updateUrl = true) {
        const input = document.getElementById('search');
        filters.search = input.value.trim(); 
        document.getElementById('clearBtn').style.display = filters.search ? 'flex' : 'none';
        if (updateUrl) {
            const url = new URL(window.location);
            if (filters.search) url.searchParams.set('q', filters.search);
            else url.searchParams.delete('q');
            window.history.replaceState({}, '', url);
        }
        render(true); 
        renderSuggestions(input.value);
    }
    
    function clearSearch() { 
        const input = document.getElementById('search');
        input.value = ''; handleInput(); input.focus(); 
    }

    function renderSuggestions(inputText) {
        const box = document.getElementById('suggestRow');
        box.innerHTML = ''; if (!inputText) return;
        const userWords = inputText.toLowerCase().split(/\s+/);
        const targetIndex = userWords.length - 1;
        const targetFragment = userWords[targetIndex]; 
        let nextWordsSet = new Set();
        db.forEach(r => {
            const cleanName = (r.Name_DE + ' ' + (r.Name_RU||'') + ' ' + (r.Substance||'') + ' ' + (r.Substance_RU||'') + ' ' + (r.Form||'') + ' ' + r.Hersteller).replace(/[.,()]/g, '').toLowerCase();
            const productWords = cleanName.split(/\s+/).filter(w => w.length > 0);
            let isMatchChain = true;
            for (let i = 0; i < targetIndex; i++) {
                const variations = getSearchVariations(userWords[i]);
                if (!productWords[i] || !variations.some(v => productWords[i].includes(v))) { isMatchChain = false; break; }
            }
            if (isMatchChain) {
                const candidateWord = productWords[targetIndex];
                const targetVariations = getSearchVariations(targetFragment);
                if (candidateWord && targetVariations.some(v => candidateWord.startsWith(v))) {
                    if (!targetVariations.some(v => v === candidateWord) || targetFragment === '') nextWordsSet.add(candidateWord);
                }
            }
        });
        Array.from(nextWordsSet).sort().slice(0, 8).forEach(word => {
            const chip = document.createElement('div');
            chip.className = 's-chip'; chip.innerText = word;
            chip.onclick = () => applySuggestionChain(word, userWords, targetIndex);
            box.appendChild(chip);
        });
    }

    function applySuggestionChain(selectedWord, currentWordsArr, indexToReplace) {
        const input = document.getElementById('search');
        currentWordsArr[indexToReplace] = selectedWord;
        input.value = currentWordsArr.join(' ') + ' ';
        input.focus(); handleInput();
    }
    /* =========================================
       BLOCK 4: РЕНДЕР (ЖЕЛЕЗНЫЙ ВАРИАНТ)
       ========================================= */
    
    // 1. Создаем глобальную функцию для обработки ошибок картинок
    // Это самый надежный способ, кавычки больше не будут ломать сайт
    window.handleImgError = function(img) {
        const div = document.createElement('div');
        div.className = 'product-thumb';
        div.style.cssText = 'background:#f9f9f9; display:flex; align-items:center; justify-content:center; color:#ccc; font-size:24px;';
        div.innerText = '📷';
        img.replaceWith(div);
    };

    function getQty(pzn) { const item = cart.find(i => i.pzn === pzn); return item ? item.qty : 0; }

// Добавляем параметр isNewSearch
function render(isNewSearch = false) {
        const list = document.getElementById('list'); 
        const intro = document.getElementById('introBlock');
        if (isNewSearch) window.scrollTo({ top: 0, behavior: 'instant' }); 

        list.innerHTML = '';
        if (!filters.search) { intro.style.display = 'block'; return; }
        intro.style.display = 'none';

        const results = db.filter(r => {
            if (!r || !r.Name_DE) return false;
            const text = (r.Name_DE + ' ' + (r.Name_RU||'') + ' ' + (r.Form||'') + ' ' + r.Hersteller + ' ' + r.PZN).toLowerCase();
            return text.includes(filters.search.toLowerCase());
        });

        // --- БЛОК "НИЧЕГО НЕ НАЙДЕНО" С ПОРОГОМ В 3 СИМВОЛА ---
        // --- БЛОК "НИЧЕГО НЕ НАЙДЕНО" (Professional Style) ---
        // --- БЛОК "НИЧЕГО НЕ НАЙДЕНО" (СТРОГИЙ СТИЛЬ) ---
        if (results.length === 0) {
            if (filters.search.length < 3) return;

            const searchTxt = "Здравствуйте RxDE, ищу: " + filters.search;
            
            list.innerHTML = `
                <div style="padding: 20px 10px;">
                    <div style="border: 1px solid var(--p); border-radius: 8px; background: #fff; padding: 30px 20px; text-align: center;">
                        
                        <div style="font-size: 24px; color: #000; margin-bottom: 15px; letter-spacing: 2px;">
                            ...
                        </div>

                        <div style="font-size: 16px; font-weight: 700; color: #000; margin-bottom: 15px; text-transform: uppercase;">
                            Нет совпадений
                        </div>

                        <div style="font-size: 15px; color: #333; line-height: 1.5; margin-bottom: 25px;">
                            Текущая база ежедневно дополняется.<br><br>
                            Напишите — мы проведем поиск по базе аптеки и вернемся к Вам с результатом.
                        </div>

                        <div class="grid-3-btns">
                            <button class="b-cell wa" onclick="currentPreparedText='${searchTxt}'; submitFinal('wa')"><span>WhatsApp</span></button>
                            <button class="b-cell tg" onclick="currentPreparedText='${searchTxt}'; submitFinal('tg')"><span>Telegram</span></button>
                            <button class="b-cell other" onclick="openContactForm('${searchTxt}')"><span>Другое</span></button>
                        </div>

                    </div>
                </div>`;
            return;
        }

        // Отрисовка карточек
        results.forEach(r => {
            const price = parseFloat(r.Price.replace(',','.'));
            const q = getQty(r.PZN);
            const isRx = r.R && r.R !== "0" && !r.R.toLowerCase().includes("no");
            
            let btnHtml = q > 0 
                ? `<div class="qty-capsule">
                     <button class="q-btn" onclick="modQty('${r.PZN}',-1, event)">−</button>
                     <span class="q-val">${q}</span>
                     <button class="q-btn" onclick="modQty('${r.PZN}',1, event)">+</button>
                   </div>`
                : `<button class="btn-capsule-add" onclick="modQty('${r.PZN}',1, event)">Добавить</button>`;

            const sumHtml = q > 0 
                ? `<div class="s-eur">${Math.round(price * q)}€</div><div class="s-rub">${getRubPrice(price * q).toLocaleString()}₽</div>` 
                : '';

            list.innerHTML += `
            <div class="card ${q > 0 ? 'selected' : ''}">
                <img src="img/${r.PZN}.webp" class="product-thumb" onerror="handleImgError(this)">
                <div class="card-body">
                    <div class="c-title">${r.Name_DE} ${isRx ? '<span class="b-rx">RX</span>' : ''}</div>
                    <div class="card-bottom">
                        <div class="c-meta-box"><div>${r.Hersteller}</div><div>PZN: ${r.PZN}</div></div>
                        <div class="c-ctrl">
                            <div class="u-price">${Math.round(price)} €</div>
                            <div class="qty-capsule-wrap">${btnHtml}</div>
                            <div class="sum-box">${sumHtml}</div>
                        </div>
                    </div>
                </div>
            </div>`;
        });
    }

    /* =========================================
   BLOCK 5: ЛОГИКА КОРЗИНЫ (ИСПРАВЛЕНА АНИМАЦИЯ)
   ========================================= */
function modQty(pzn, d, event) { 
    // МГНОВЕННО СБРАСЫВАЕМ ДАТУ ВОССТАНОВЛЕНИЯ
    restoredDate = ""; 

    if (event) {
        event.stopPropagation();
        const btn = event.target.closest('button') || event.currentTarget;
        if (btn) {
            const rect = btn.getBoundingClientRect();
            const product = db.find(r => r.PZN === pzn);
            animateFly(rect, d < 0, product ? product.Size : 0);
        }
    }

    const index = cart.findIndex(i => i.pzn === pzn);
    if (index === -1) { 
        if (d > 0) cart.push({ pzn: pzn, qty: 1 }); 
    } else { 
        let newQty = cart[index].qty + d; 
        if (newQty <= 0) {
            cart.splice(index, 1); 
            if (cart.length === 0) closeModal();
        } else {
            cart[index].qty = newQty; 
        }
    }
    localStorage.setItem('de_cart_arr', JSON.stringify(cart));
    updateBar(); 
    render(false); 
    if (document.getElementById('modal').classList.contains('active')) renderCartItems(); 
}

    /* === ГЕНЕРАЦИЯ ЧЕКА (СТРОГИЙ СТИЛЬ БЕЗ СКОБОК) === */
function getOrderTextAndLink() {
    if (cart.length === 0) return null;
    const fmt = (n) => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");

    const now = new Date();
    const dateStr = now.toLocaleDateString('ru-RU');
    const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const fullDt = `${dateStr} в ${timeStr}`;

    let text = `[${dateStr}] Расчетный курс: ${fmt(rateCalc)} ₽\n`;
    let totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
    text += `${totalQty} pack\n\n`;

    let itemsSumEur = 0;
    let breakdown = []; 

    cart.forEach((item, idx) => {
        const r = db.find(x => String(x.PZN) === String(item.pzn));
        if (r) {
            const price = Math.round(parseFloat(r.Price.replace(',', '.')));
            const sum = price * item.qty;
            itemsSumEur += sum;
            breakdown.push(sum);
            const sizeStr = r.Size ? ` ${r.Size}` : ''; 
            const fullDesc = `${r.Name_DE}${sizeStr}, ${r.Hersteller}, PZN ${r.PZN}`;
            let math = item.qty > 1 ? `${fmt(price)}€*${item.qty}pack= ${fmt(sum)}€` : `${fmt(sum)}€`;
            text += `${idx + 1}.\n${fullDesc}...${math}\n\n`;
        }
    });

    text += `Тариф почты из Германии.... ${shipEur}€\n`;
    const totalEur = itemsSumEur + shipEur;
    text += `\n${shipEur}+${breakdown.join('+')} = ${fmt(totalEur)}€\n`;
    const finalRub = Math.floor((totalEur * rateCalc) / 100) * 100;
    text += `ИТОГО: ${fmt(totalEur)}€ * ${fmt(rateCalc)} = ${fmt(finalRub)} ₽\n`;

    const cartStr = cart.map(i => `${i.pzn}:${i.qty}`).join(',');
    const fullLink = `${window.location.origin}${window.location.pathname}?c=${cartStr}&d=${encodeURIComponent(fullDt)}`;

    text += `\nВаша собранная корзина у Вас под рукой - всегда актуальные цены!\n${fullLink}`;
    return { text: text, link: fullLink };
}

    // 2. Отправка в выбранное приложение
    function sendToMessenger(app) {
        const data = getOrderTextAndLink();
        if (!data) {
            alert("Корзина пуста");
            return;
        }

        const intro = app === 'wa' 
            ? "Здравствуйте RxDE! Хочу оформить заказ:\n\n" 
            : "Здравствуйте! Оформляю заказ через сайт:\n\n";
            
        const fullMessage = intro + data.text;
        
        // Резервное копирование в буфер обмена
        try {
            navigator.clipboard.writeText(fullMessage);
        } catch (e) {
            console.log("Clipboard error");
        }

        const encodedMsg = encodeURIComponent(fullMessage);
        let url = "";
        
        if (app === 'wa') {
            url = `https://wa.me/${WA_PHONE}?text=${encodedMsg}`;
        } else if (app === 'tg') {
            url = `https://t.me/${TG_USER}`;
            alert("Текст заказа скопирован в буфер! Вставьте его в чат с менеджером.");
        }

        if (url) window.open(url, '_blank');
    }

function animateFly(sRect, isRemoving = false, productSize = 0) {
    // 1. Проверки
    if (!sRect || (sRect.left === 0 && sRect.top === 0)) {
        playSound(isRemoving);
        return;
    }
    
    // 2. Определяем цель
    const modal = document.getElementById('modal');
    const isModalOpen = modal && modal.classList.contains('active');
    const targetId = isModalOpen ? 'footerTotalSum' : 'miniCart';
    const targetEl = document.getElementById(targetId);

    if (!targetEl) return;
    const tRect = targetEl.getBoundingClientRect();

    // 3. ЛОГИКА КОЛИЧЕСТВА (ГЕЙМИФИКАЦИЯ)
    let count = 1;
    
    const sizeVal = parseInt(productSize) || 0;
    if (sizeVal >= 150) count = 3;      // Много
    else if (sizeVal >= 100) count = 2; // Средне
    else count = 1;                     // Мало
    

    // 4. ЗАПУСК ОЧЕРЕДИ
    playSound(isRemoving);
    
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            createSinglePill(sRect, tRect, isRemoving, targetId);
        }, i * 150); // Чуть увеличил интервал (150мс), чтобы очередь была заметнее
    }
}

    fly.innerHTML = `<div class="pill-3d-visual"></div>`;
    
    fly.style.cssText = `
        position: fixed; z-index: 99999; pointer-events: none; 
        left: 0; top: 0; 
        display: flex; align-items: center; justify-content: center; 
        width: 40px; height: 40px;
    `;

    // Координаты
    const pX = sRect.left + sRect.width/2 - 20; // Товар
    const pY = sRect.top + sRect.height/2 - 20; 
    const cX = tRect.left + tRect.width/2 - 20; // Корзина
    const cY = tRect.top + tRect.height/2 - 20; 
    
    // ТОЧКА "ПОДВАЛА" (ниже корзины)
    const underY = cY + 30; 

    // --- УДАЛЕНИЕ (ВЫПАЛА -> ПОВИСЕЛА -> УЛЕТЕЛА) ---
    if (isRemoving) {
        // 1. Старт в корзине (серая)
        fly.style.transform = `translate(${cX}px, ${cY}px) scale(0.5)`;
        fly.style.filter = 'grayscale(100%) opacity(0.8)';
        
        document.body.appendChild(fly);
        void fly.offsetWidth; 

        // 2. Выпадает вниз
        fly.style.transition = 'all 0.4s cubic-bezier(0.5, 0, 0.5, 1)';
        fly.style.transform = `translate(${cX}px, ${underY}px) scale(0.8) rotate(20deg)`;
        
        // 3. Висит и улетает домой
        setTimeout(() => {
            fly.style.transition = 'all 0.8s ease-in-out';
            fly.style.transform = `translate(${pX}px, ${pY}px) scale(0.4) rotate(-90deg)`;
            fly.style.opacity = '0';
            
            setTimeout(() => fly.remove(), 800);
        }, 1000); // Пауза внизу
    } 
    
    // --- ДОБАВЛЕНИЕ (НЫРНУЛА ПОД КОРЗИНУ -> ПРЫГНУЛА) ---
    else {
        // 1. Старт от товара
        fly.style.transform = `translate(${pX}px, ${pY}px) scale(0.3)`;
        fly.style.opacity = '0.8';
        fly.style.filter = 'none';
        
        document.body.appendChild(fly);
        void fly.offsetWidth;

        // 2. Летит ПОД корзину
        fly.style.transition = 'all 0.5s ease-in';
        fly.style.transform = `translate(${cX}px, ${underY}px) scale(1) rotate(20deg)`;
        fly.style.opacity = '1';

        // 3. Прыжок вверх ("Чпоньк")
        setTimeout(() => {
            fly.style.transition = 'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            fly.style.transform = `translate(${cX}px, ${cY}px) scale(0.2) rotate(720deg)`;
            fly.style.opacity = '0';
            
            // Удар об корзину
            setTimeout(() => {
                const target = document.getElementById(targetId);
                if (target) {
                    const blinkClass = 'pulse';
                    target.classList.add(blinkClass);
                    setTimeout(() => target.classList.remove(blinkClass), 300);
                }
                fly.remove();
            }, 200); 
            
        }, 800); // Пауза перед прыжком
    }
}

    /* =========================================
       BLOCK 9: КОПИРОВАНИЕ И ЗАПУСК
       ========================================= */
    let clickTimer = null;
    function handleLogoClick() {
        if (clickTimer) {
            clearTimeout(clickTimer); clickTimer = null;
            copyCartData(); 
        } else {
            clickTimer = setTimeout(() => {
                copyFilterResults(); clickTimer = null;
            }, 300);
        }
    }

    function blinkLogo(color) {
        const logo = document.querySelector('.embedded-logo');
        const className = color === 'green' ? 'flash-green' : 'flash-yellow';
        logo.classList.add(className);
        if (navigator.vibrate) navigator.vibrate(50);
        setTimeout(() => { logo.classList.remove(className); }, 400);
    }

    function copyFilterResults() {
        if (!filters.search) return;
        const tokens = filters.search.toLowerCase().split(/\s+/).map(t => getSearchVariations(t));
        let currentResults = db.filter(r => {
             if (!r.Name_DE) return false;
             const text = (r.Name_DE + ' ' + (r.Name_RU||'') + ' ' + (r.Substance||'') + ' ' + (r.Substance_RU||'') + ' ' + (r.Form||'') + ' ' + r.Hersteller + ' ' + r.PZN).toLowerCase();
             return tokens.every(vrs => vrs.some(v => text.includes(v)));
        });
        if (currentResults.length === 0) return;
        currentResults.sort((a, b) => parseFloat(a.Price.replace(',','.')) - parseFloat(b.Price.replace(',','.')));
        const dateNow = new Date().toLocaleDateString('ru-RU');
        let text = `Результаты поиска "${filters.search}" [${dateNow}]:\n\n`;
        currentResults.slice(0, 30).forEach(r => {
            const p = parseFloat(r.Price.replace(',','.'));
            text += `🔹 ${r.Name_DE}\n   ${Math.round(p)}€\n\n`;
        });
        const cleanUrl = window.location.origin + window.location.pathname;
        const link = `${cleanUrl}?q=${encodeURIComponent(filters.search)}`;
        text += `🔗 Ссылка: ${link}`;
        navigator.clipboard.writeText(text).then(() => blinkLogo('yellow'));
    }

    function copyCartData() {
        if (cart.length === 0) return;
        const data = getOrderTextAndLink();
        if(data) {
            navigator.clipboard.writeText(data.text + `\n` + data.link).then(() => blinkLogo('green'));
        }
    }

    /* === ВОССТАНОВЛЕНИЕ КОРЗИНЫ ИЗ ССЫЛКИ === */
function tryRestoreCartFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const cartParam = params.get('c');
    const dateParam = params.get('d'); 
    
    if (cartParam) {
        try {
            const items = cartParam.split(',');
            const newCart = [];
            items.forEach(pair => {
                const [pzn, qtyStr] = pair.split(':');
                const qty = parseInt(qtyStr);
                if (pzn && qty > 0) newCart.push({ pzn: pzn, qty: qty });
            });

            if (newCart.length > 0) {
                cart = newCart;
                localStorage.setItem('de_cart_arr', JSON.stringify(cart));
                if (dateParam) restoredDate = decodeURIComponent(dateParam);
                window.history.replaceState({}, '', window.location.origin + window.location.pathname);
                return true; 
            }
        } catch (e) { console.error("Restore Error", e); }
    }
    return false;
}

    // ЗАПУСК ПРИЛОЖЕНИЯ
        init();

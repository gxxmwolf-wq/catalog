<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RXDE.online — сервис доставки лекарств из Германии</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>

<div class="cont">
    <div class="top-row">
        <div class="slogan-top">Справочник лекарств</div>
        <div class="rates-top">€: <span id="finalRate">...</span></div>
    </div>

    <div class="sticky">
        <div class="inp-wrap">
            <div class="embedded-logo"><span class="rx-part">RX</span><span class="de-part">DE</span></div>
            <input type="text" id="search" class="search-input" placeholder="Поиск (рус / lat)..." oninput="handleInput()" autocomplete="off">
            <span class="cls-btn" id="clearBtn" onclick="clearSearch()" style="display:none">✕</span>
        </div>
    </div>
    
    <div id="list"></div>
    
    <div id="introBlock" class="intro-section">
        <h2>Deutsche Qualität.</h2>
        <p>Введите название препарата в поиске выше.</p>
        <p>Ваш заказ будет отображаться в интерактивном чеке справа.</p>
    </div>
</div>

<div id="miniCart" class="mini-cart-fab" onclick="openCart()">
    <div id="miniReceipt" class="mini-receipt" onclick="event.stopPropagation(); openCart()"></div>
    <div class="mini-cart-badge" id="miniCount">0</div>
    <div class="mini-cart-icon">🛒</div>
    <div class="mini-cart-total" id="miniPrice">0 €</div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="m-box" onclick="event.stopPropagation()">
        <h3 class="modal-head"><span>Ваш заказ</span><span onclick="closeModal()" class="close-x">✕</span></h3>
        <div id="cartItems"></div>
        <div id="summaryBox" class="summary-box"></div>
        <div class="contact-grid">
            <button onclick="doShare('tg')" class="c-btn tg">Telegram</button>
            <button onclick="doShare('wa')" class="c-btn wa">WhatsApp</button>
        </div>
    </div>
</div>

<script>
    const LOCAL_DB_URL = 'db.csv'; 
    const GOOGLE_SETTINGS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTh9jBKA_RFbB03wt7VljCrZqxM9wBq9aGadw1uHCD4PQ5z5K3YoiF1bkxabc1kzPtP6tA6FLOxOB6b/pub?gid=23735297&single=true&output=csv';
    const CBR_API_URL = 'https://www.cbr-xml-daily.ru/daily_json.js';
    const KURS_FALLBACK = 100; 
    const TG_USER = 'remed01';
    const WA_PHONE = '79650302556';

    let db = [], cart = {};
    let rateCalc = KURS_FALLBACK, shipEur = 50; 
    let filters = { search: '' };

    // === ВОЗВРАЩАЕМ КЛАССНЫЙ ЗВУК ОТ GOOGLE ===
    // Тот самый приятный "Pop"
    const audioAdd = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
    // Тихий "Свайп"
    const audioRem = new Audio("https://actions.google.com/sounds/v1/cartoon/swipe.ogg");

    function playSound(type) {
        if(type === 'add') {
            audioAdd.currentTime = 0;
            audioAdd.volume = 0.35; // Приятная средняя громкость
            audioAdd.play().catch(e=>{});
        } else {
            audioRem.currentTime = 0;
            audioRem.volume = 0.2; // Очень тихо
            audioRem.play().catch(e=>{});
        }
    }

    function init() {
        try { const saved = localStorage.getItem('de_cart'); if (saved) cart = JSON.parse(saved); } catch(e) { cart = {}; }
        fetchLocalDB().then(() => {
            calculateFinalLogic(); 
            Promise.all([fetchCbrRate(), fetchGoogleSettings()]).then(() => calculateFinalLogic());
        });
    }

    async function fetchLocalDB() {
        const url = LOCAL_DB_URL + '?v=' + new Date().getTime();
        return new Promise(resolve => {
            Papa.parse(url, { download: true, header: true, skipEmptyLines: true, complete: res => { db = res.data; resolve(); } });
        });
    }

    async function fetchGoogleSettings() {
        const url = GOOGLE_SETTINGS_URL + '&t=' + new Date().getTime();
        return new Promise(resolve => {
            Papa.parse(url, { download: true, header: true, skipEmptyLines: true, complete: res => { if(res.data) googleSettings = res.data[0]; resolve(); }, error: () => resolve() });
        });
    }

    async function fetchCbrRate() {
        try { const response = await fetch(CBR_API_URL); const data = await response.json(); cbrRateData = data.Valute.EUR.Value; } catch (e) { cbrRateData = 0; }
    }

    function calculateFinalLogic() {
        if (!db.length) return;
        let gRate = 0, gSmena = 0, gMail = 0;
        if (typeof googleSettings !== 'undefined' && googleSettings) {
            gRate = parseFloat(googleSettings.Current_Rate?.replace(',', '.') || 0);
            gSmena = parseFloat(googleSettings.Bank_Smena?.replace(',', '.') || 0);
            gMail = parseFloat(googleSettings.Mail_EURO?.replace(',', '.') || 0);
        }
        let baseRate = (gRate > 0) ? gRate : (typeof cbrRateData !== 'undefined' && cbrRateData > 0 ? cbrRateData : KURS_FALLBACK);
        rateCalc = baseRate + gSmena;
        shipEur = (gMail > 0) ? gMail : 50; 
        document.getElementById('finalRate').innerText = rateCalc.toFixed(2);
        updateBar();
        render(); 
    }

    function getRubPrice(eur) { return Math.floor((parseFloat(eur) * rateCalc) / 100) * 100; }

    function getTranslitVariations(word) {
        const ru2en = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya' };
        const en2ru = { 'a':'а','b':'б','v':'в','g':'г','d':'д','e':'е','z':'з','i':'и','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','r':'р','s':'с','t':'т','u':'у','f':'ф','h':'х','c':'ц','y':'ы','x':'х','w':'в' }; 
        const w = word.toLowerCase();
        let resRu = '', resEn = '';
        for(let char of w) { resEn += ru2en[char] || char; resRu += en2ru[char] || char; }
        return [w, resEn, resRu];
    }

    function handleInput() {
        const input = document.getElementById('search');
        filters.search = input.value.trim();
        document.getElementById('clearBtn').style.display = filters.search ? 'flex' : 'none';
        render(); 
    }
    
    function clearSearch() { document.getElementById('search').value = ''; handleInput(); }

    function animateFly(startElement, isRemoving = false) {
        const target = document.getElementById('miniCart');
        const fly = document.createElement('div');
        fly.className = 'fly-pill'; 
        fly.innerText = '💊';

        // ЗВУК
        playSound(isRemoving ? 'rem' : 'add');

        if (isRemoving) {
            fly.classList.add('removing');
        }

        const sRect = startElement.getBoundingClientRect();
        const tRect = target.getBoundingClientRect();

        if (isRemoving) {
            // ЛЕТИТ ОБРАТНО (Медленно)
            fly.style.left = (tRect.left + tRect.width / 2) + 'px';
            fly.style.top = (tRect.top + tRect.height / 2) + 'px';
            fly.style.transform = 'scale(0.5)';
            document.body.appendChild(fly);
            
            setTimeout(() => {
                fly.style.left = (sRect.left + sRect.width / 2) + 'px';
                fly.style.top = (sRect.top + sRect.height / 2) + 'px';
                fly.style.transform = 'scale(1) rotate(-360deg)'; 
                fly.style.opacity = '0.5'; 
            }, 50);
            
            setTimeout(() => { fly.remove(); }, 900); 

        } else {
            // ЛЕТИТ ТУДА (Быстро)
            fly.style.left = (sRect.left + sRect.width / 2) + 'px';
            fly.style.top = (sRect.top + sRect.height / 2) + 'px';
            document.body.appendChild(fly);
            
            setTimeout(() => {
                fly.style.left = (tRect.left + tRect.width / 2) + 'px';
                fly.style.top = (tRect.top + tRect.height / 2) + 'px';
                fly.style.transform = 'scale(0.1) rotate(360deg)'; 
                fly.style.opacity = '0.5'; 
            }, 50);

            setTimeout(() => { target.classList.add('pulse'); }, 600);
            setTimeout(() => target.classList.remove('pulse'), 900);
            setTimeout(() => { fly.remove(); }, 600);
        }
    }

    function render() {
        const list = document.getElementById('list'); 
        const intro = document.getElementById('introBlock');
        list.innerHTML = '';
        let results = [];

        if (filters.search) {
            intro.style.display = 'none';
            const tokens = filters.search.toLowerCase().split(/\s+/).map(t => getTranslitVariations(t));
            results = db.filter(r => {
                if (!r.Name_DE) return false;
                const text = (r.Name_DE + ' ' + (r.Form||'') + ' ' + r.Hersteller + ' ' + r.PZN).toLowerCase();
                return tokens.every(vrs => vrs.some(v => text.includes(v)));
            });
        } else {
            intro.style.display = 'block';
            return;
        }

        results.forEach(r => {
            const price = parseFloat(r.Price.replace(',','.'));
            const q = cart[r.PZN] || 0;
            const isRx = r.R && r.R !== "0" && !r.R.toLowerCase().includes("no");
            list.innerHTML += `
            <div class="card ${q > 0 ? 'selected' : ''}">
                <div class="c-info">
                    <div class="c-title">${r.Name_DE} ${isRx ? '<span class="b-rx">RX</span>' : ''}</div>
                    <div class="c-meta">${r.Hersteller} | PZN: ${r.PZN}</div>
                </div>
                <div class="c-ctrl">
                    <div class="u-price">${Math.round(price)} €</div>
                    <div class="qty-capsule-wrap">
                        ${q > 0 ? `
                            <div class="qty-capsule">
                                <button class="q-btn" onclick="modQty('${r.PZN}',-1, event)">−</button>
                                <span class="q-val">${q}</span>
                                <button class="q-btn" onclick="modQty('${r.PZN}',1, event)">+</button>
                            </div>
                        ` : `<button class="btn-capsule-add" onclick="modQty('${r.PZN}',1, event)">Добавить</button>`}
                    </div>
                    <div class="sum-box">
                        ${q > 0 ? `<div class="s-eur">${Math.round(price * q)}€</div><div class="s-rub">${getRubPrice(price * q).toLocaleString()}₽</div>` : ''}
                    </div>
                </div>
            </div>`;
        });
    }

    function modQty(pzn, d, event) { 
        if (event) animateFly(event.target, d < 0);
        let current = cart[pzn] || 0;
        if (d === 0) delete cart[pzn];
        else {
            let next = current + d;
            if (next <= 0) delete cart[pzn]; else cart[pzn] = next;
        }
        localStorage.setItem('de_cart', JSON.stringify(cart));
        updateBar(); render(); 
        
        // Исправленная проверка класса active для обновления модалки
        const modal = document.getElementById('modal');
        if (modal.classList.contains('active')) {
            renderCartItems();
        }
    }

    function updateBar() {
        let totalEur = 0, count = 0; 
        let receiptHtml = '';
        let activeItems = [];

        db.forEach(r => { 
            if(cart[r.PZN] > 0) { 
                const p = Math.round(parseFloat(r.Price.replace(',','.')));
                const q = cart[r.PZN];
                const lineSum = p * q;
                totalEur += lineSum; 
                count += q;
                activeItems.push({ name: r.Name_DE, p: p, q: q, sum: lineSum });
            } 
        });

        const bar = document.getElementById('miniCart');
        const receipt = document.getElementById('miniReceipt');
        
        if(count > 0) {
            const grandTotalEur = totalEur + shipEur;
            const grandTotalRub = getRubPrice(grandTotalEur);

            let displayItems = [];
            let hasHidden = false;

            if (activeItems.length <= 6) {
                displayItems = activeItems.map((item, idx) => ({ ...item, num: idx + 1 }));
            } else {
                for(let i=0; i<3; i++) displayItems.push({ ...activeItems[i], num: i + 1 });
                hasHidden = true;
                for(let i=activeItems.length-2; i<activeItems.length; i++) displayItems.push({ ...activeItems[i], num: i + 1 });
            }

            let renderedRows = '';
            const firstPart = hasHidden ? displayItems.slice(0,3) : displayItems;
            
            firstPart.forEach(item => {
                const mathStr = item.q > 1 ? `${item.p}€ × ${item.q} pak =` : ``;
                renderedRows += `<div class="receipt-row"><span class="num">${item.num}.</span><span class="name">${item.name.substring(0,18)}..</span><span class="calc">${mathStr} <b>${item.sum}€</b></span></div>`;
            });

            if (hasHidden) {
                renderedRows += `<div class="receipt-row center">.......</div>`;
                const lastPart = displayItems.slice(3);
                lastPart.forEach(item => {
                    const mathStr = item.q > 1 ? `${item.p}€ × ${item.q} pak =` : ``;
                    renderedRows += `<div class="receipt-row"><span class="num">${item.num}.</span><span class="name">${item.name.substring(0,18)}..</span><span class="calc">${mathStr} <b>${item.sum}€</b></span></div>`;
                });
            }

            receiptHtml = renderedRows + `
                <div class="receipt-divider"></div>
                <div class="receipt-row color-ship">
                    <span class="num"></span><span class="name">Почтовый тариф</span><span class="calc">${shipEur} €</span>
                </div>
                <div class="receipt-row calc-line">Итого: ${grandTotalEur}€ × ${rateCalc.toFixed(2)}</div>
                <div class="receipt-row total-rub-line">= ${grandTotalRub.toLocaleString()} ₽</div>
            `;

            bar.classList.add('active');
            document.getElementById('miniCount').innerText = count;
            document.getElementById('miniPrice').innerText = grandTotalEur + ' €';
            receipt.innerHTML = receiptHtml;
            receipt.style.display = 'flex';
        } else {
            bar.classList.remove('active');
            receipt.style.display = 'none';
        }
    }

    function openCart() { 
        const modal = document.getElementById('modal');
        const miniCart = document.getElementById('miniCart');
        miniCart.style.display = 'none';
        renderCartItems();
        modal.classList.add('active'); 
        setTimeout(() => { modal.classList.add('open'); }, 10);
    }

    function closeModal() { 
        const modal = document.getElementById('modal');
        const miniCart = document.getElementById('miniCart');
        const searchInput = document.getElementById('search');
        modal.classList.remove('open');
        setTimeout(() => {
            modal.classList.remove('active');
            miniCart.style.display = 'flex'; 
            updateBar(); 
        }, 300);
        searchInput.focus();
    }

    function renderCartItems() {
        const div = document.getElementById('cartItems'); div.innerHTML = '';
        let totalEur = 0;
        let counter = 1;

        db.forEach(r => { 
            if(cart[r.PZN] > 0) { 
                const q = cart[r.PZN], p = parseFloat(r.Price.replace(',','.'));
                totalEur += p * q;
                div.innerHTML += `
                <div class="m-row-interactive">
                    <div class="m-info">
                        <span class="m-num">${counter++}.</span>
                        <div class="m-text">
                            <div class="m-name">${r.Name_DE}</div>
                            <div class="m-meta">${r.Hersteller}</div>
                        </div>
                    </div>
                    <div class="m-ctrl-block">
                         <div class="qty-capsule">
                            <button class="q-btn" onclick="modQty('${r.PZN}',-1, null)">−</button>
                            <span class="q-val">${q}</span>
                            <button class="q-btn" onclick="modQty('${r.PZN}',1, null)">+</button>
                        </div>
                        <div class="m-price-block">
                            <div class="m-eur">${Math.round(p * q)} €</div>
                        </div>
                    </div>
                </div>`;
            } 
        });

        if (totalEur === 0) div.innerHTML = '<div style="text-align:center; padding:20px; color:#999;">Корзина пуста</div>';
        document.getElementById('summaryBox').innerHTML = `<div class="sum-line"><span>Итого:</span><b>${Math.round(totalEur + shipEur)} €</b></div><div class="sum-rub">${getRubPrice(totalEur + shipEur).toLocaleString()} ₽</div>`;
    }

    function doShare(type) {
        let text = "Заказ RXDE:\n", total = 0;
        db.forEach(r => { if(cart[r.PZN] > 0) { text += `- ${r.Name_DE} (x${cart[r.PZN]})\n`; total += parseFloat(r.Price.replace(',','.')) * cart[r.PZN]; } });
        text += `\nСумма: ${Math.round(total + shipEur)} EUR.`;
        const enc = encodeURIComponent(text);
        if(type === 'tg') window.open(`https://t.me/${TG_USER}?text=${enc}`);
        if(type === 'wa') window.open(`https://wa.me/${WA_PHONE}?text=${enc}`);
    }
    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RXDE.online — сервис доставки лекарств из Германии</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>

<div class="cont">
    <div class="top-row">
        <div class="slogan-top">Справочник лекарств</div>
        <div class="rates-top">€: <span id="finalRate">...</span></div>
    </div>

    <div class="sticky">
        <div class="inp-wrap">
            <div class="embedded-logo" ondblclick="copyForClient()" title="Double click to copy offer"><span class="rx-part">RX</span><span class="de-part">DE</span></div>
            <input type="text" id="search" class="search-input" placeholder="Поиск (рус / lat)..." oninput="handleInput()" autocomplete="off">
            <span class="cls-btn" id="clearBtn" onclick="clearSearch()" style="display:none">✕</span>
        </div>
    </div>
    
    <div id="list"></div>
    
    <div id="introBlock" class="intro-section">
        <h2>Deutsche Qualität.</h2>
        <p>Введите название препарата в поиске выше.</p>
        <p>Ваш заказ будет отображаться в интерактивном чеке справа.</p>
    </div>
</div>

<div id="miniCart" class="mini-cart-fab" onclick="openCart()">
    <div id="miniReceipt" class="mini-receipt" onclick="event.stopPropagation(); openCart()"></div>
    <div class="mini-cart-badge" id="miniCount">0</div>
    <div class="mini-cart-icon">🛒</div>
    <div class="mini-cart-total" id="miniPrice">0 €</div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="m-box" onclick="event.stopPropagation()">
        <h3 class="modal-head"><span>Ваш заказ</span><span onclick="closeModal()" class="close-x">✕</span></h3>
        <div id="cartItems"></div>
        <div id="summaryBox" class="summary-box"></div>
        <div class="contact-grid">
            <button onclick="doShare('tg')" class="c-btn tg">Telegram</button>
            <button onclick="doShare('wa')" class="c-btn wa">WhatsApp</button>
        </div>
    </div>
</div>

<script>
    /* =========================================
       BLOCK 1: КОНФИГУРАЦИЯ И ПЕРЕМЕННЫЕ
       ========================================= */
    const LOCAL_DB_URL = 'db.csv'; 
    const GOOGLE_SETTINGS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTh9jBKA_RFbB03wt7VljCrZqxM9wBq9aGadw1uHCD4PQ5z5K3YoiF1bkxabc1kzPtP6tA6FLOxOB6b/pub?gid=23735297&single=true&output=csv';
    const CBR_API_URL = 'https://www.cbr-xml-daily.ru/daily_json.js';
    const KURS_FALLBACK = 100; 
    const TG_USER = 'remed01';
    const WA_PHONE = '79650302556';

    let db = [], cart = [];
    let rateCalc = KURS_FALLBACK, shipEur = 50; 
    let filters = { search: '' };

    // Звуки
    const audioAdd = new Audio("sounds/add.mp3");
    const audioRem = new Audio("sounds/remove.mp3");

    function playSound(type) {
        if(type === 'add') {
            audioAdd.currentTime = 0; audioAdd.volume = 0.4; audioAdd.play().catch(e=>{});
        } else {
            audioRem.currentTime = 0; audioRem.volume = 0.3; audioRem.play().catch(e=>{});
        }
    }

    /* =========================================
       BLOCK 2: ИНИЦИАЛИЗАЦИЯ И ЗАГРУЗКА
       ========================================= */
    function init() {
        try { 
            const saved = localStorage.getItem('de_cart_arr'); 
            if (saved) cart = JSON.parse(saved); 
            if (!Array.isArray(cart)) cart = []; 
        } catch(e) { cart = []; }
        
        fetchLocalDB().then(() => {
            Promise.all([fetchCbrRate(), fetchGoogleSettings()]).then(() => {
                calculateFinalLogic();
                // Deep Link Logic
                const urlParams = new URLSearchParams(window.location.search);
                const query = urlParams.get('q');
                if (query) {
                    const input = document.getElementById('search');
                    input.value = query;
                    filters.search = query;
                    handleInput(false);
                }
            });
        });
    }

    async function fetchLocalDB() {
        const url = LOCAL_DB_URL + '?v=' + new Date().getTime();
        return new Promise(resolve => {
            Papa.parse(url, { download: true, header: true, skipEmptyLines: true, complete: res => { db = res.data; resolve(); } });
        });
    }

    async function fetchGoogleSettings() {
        const url = GOOGLE_SETTINGS_URL + '&t=' + new Date().getTime();
        return new Promise(resolve => {
            Papa.parse(url, { download: true, header: true, skipEmptyLines: true, complete: res => { if(res.data) googleSettings = res.data[0]; resolve(); }, error: () => resolve() });
        });
    }

    async function fetchCbrRate() {
        try { const response = await fetch(CBR_API_URL); const data = await response.json(); cbrRateData = data.Valute.EUR.Value; } catch (e) { cbrRateData = 0; }
    }

    /* =========================================
       BLOCK 3: ЯДРО РАСЧЕТОВ И УТИЛИТЫ
       ========================================= */
    function calculateFinalLogic() {
        if (!db.length) return;
        let gRate = 0, gSmena = 0, gMail = 0;
        if (typeof googleSettings !== 'undefined' && googleSettings) {
            gRate = parseFloat(googleSettings.Current_Rate?.replace(',', '.') || 0);
            gSmena = parseFloat(googleSettings.Bank_Smena?.replace(',', '.') || 0);
            gMail = parseFloat(googleSettings.Mail_EURO?.replace(',', '.') || 0);
        }
        let baseRate = (gRate > 0) ? gRate : (typeof cbrRateData !== 'undefined' && cbrRateData > 0 ? cbrRateData : KURS_FALLBACK);
        rateCalc = baseRate + gSmena;
        shipEur = (gMail > 0) ? gMail : 50; 
        document.getElementById('finalRate').innerText = rateCalc.toFixed(2);
        updateBar();
        render(); 
    }

    function getRubPrice(eur) { return Math.floor((parseFloat(eur) * rateCalc) / 100) * 100; }

    function getTranslitVariations(word) {
        const ru2en = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya' };
        const en2ru = { 'a':'а','b':'б','v':'в','g':'г','d':'д','e':'е','z':'з','i':'и','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','r':'р','s':'с','t':'т','u':'у','f':'ф','h':'х','c':'ц','y':'ы','x':'х','w':'в' }; 
        const w = word.toLowerCase();
        let resRu = '', resEn = '';
        for(let char of w) { resEn += ru2en[char] || char; resRu += en2ru[char] || char; }
        return [w, resEn, resRu];
    }

    function handleInput(updateUrl = true) {
        const input = document.getElementById('search');
        filters.search = input.value.trim();
        document.getElementById('clearBtn').style.display = filters.search ? 'flex' : 'none';
        
        if (updateUrl) {
            const url = new URL(window.location);
            if (filters.search) url.searchParams.set('q', filters.search);
            else url.searchParams.delete('q');
            window.history.replaceState({}, '', url);
        }
        render(); 
    }
    
    function clearSearch() { document.getElementById('search').value = ''; handleInput(); }

    /* =========================================
       BLOCK 4: РЕНДЕР ГЛАВНОГО СПИСКА (НОВАЯ СТРУКТУРА)
       ========================================= */
    function getQty(pzn) { const item = cart.find(i => i.pzn === pzn); return item ? item.qty : 0; }

    function render() {
        const list = document.getElementById('list'); 
        const intro = document.getElementById('introBlock');
        list.innerHTML = '';
        let results = [];

        if (filters.search) {
            intro.style.display = 'none';
            const tokens = filters.search.toLowerCase().split(/\s+/).map(t => getTranslitVariations(t));
            results = db.filter(r => {
                if (!r.Name_DE) return false;
                const text = (r.Name_DE + ' ' + (r.Form||'') + ' ' + r.Hersteller + ' ' + r.PZN).toLowerCase();
                return tokens.every(vrs => vrs.some(v => text.includes(v)));
            });
        } else { intro.style.display = 'block'; return; }

        results.forEach(r => {
            const price = parseFloat(r.Price.replace(',','.'));
            const q = getQty(r.PZN);
            const isRx = r.R && r.R !== "0" && !r.R.toLowerCase().includes("no");
            
            const imagePath = r.Image ? `img/${r.Image}` : ''; 
            
            // Если картинки нет, показываем иконку
            const imgHtml = imagePath 
                ? `<img src="${imagePath}" class="product-thumb" alt="foto" onerror="this.replaceWith('📷')">`
                : `<div class="product-thumb" style="background:#f9f9f9; display:flex; align-items:center; justify-content:center; color:#ddd; font-size:22px;">📷</div>`;

            list.innerHTML += `
            <div class="card ${q > 0 ? 'selected' : ''}">
                
                ${imgHtml}

                <div class="card-body">
                    
                    <div class="c-title">
                        ${r.Name_DE} ${isRx ? '<span class="b-rx">RX</span>' : ''}
                    </div>

                    <div class="card-bottom">
                        <div class="c-meta-box">
                            <div>${r.Hersteller}</div>
                            <div>PZN: ${r.PZN}</div>
                        </div>

                        <div class="c-ctrl">
                            <div class="u-price">${Math.round(price)} €</div>
                            
                            <div class="qty-capsule-wrap">
                                ${q > 0 ? `
                                    <div class="qty-capsule">
                                        <button class="q-btn" onclick="modQty('${r.PZN}',-1, event)">−</button>
                                        <span class="q-val">${q}</span>
                                        <button class="q-btn" onclick="modQty('${r.PZN}',1, event)">+</button>
                                    </div>
                                ` : `<button class="btn-capsule-add" onclick="modQty('${r.PZN}',1, event)">Добавить</button>`}
                            </div>

                            <div class="sum-box">
                                ${q > 0 ? `<div class="s-eur">${Math.round(price * q)}€</div><div class="s-rub">${getRubPrice(price * q).toLocaleString()}₽</div>` : ''}
                            </div>
                        </div>
                    </div>
                </div>

            </div>`;
        });
    }

    /* =========================================
       BLOCK 5: ЛОГИКА КОРЗИНЫ (ОЧЕРЕДЬ)
       ========================================= */
    function modQty(pzn, d, event) { 
        const product = db.find(r => r.PZN === pzn);
        const sizeStr = product ? product.Size : "0";
        if (event) animateFly(event.target, d < 0, sizeStr);
        
        const index = cart.findIndex(i => i.pzn === pzn);
        
        // ВАЖНО: Новый товар добавляем В КОНЕЦ (push)
        if (index === -1) { 
            if (d > 0) cart.push({ pzn: pzn, qty: 1 }); 
        } else { 
            let newQty = cart[index].qty + d; 
            if (newQty <= 0) cart.splice(index, 1); 
            else cart[index].qty = newQty; 
        }
        
        localStorage.setItem('de_cart_arr', JSON.stringify(cart));
        updateBar(); 
        render(); 
        if (document.getElementById('modal').classList.contains('active')) renderCartItems();
    }

    /* =========================================
       BLOCK 6: МИНИ-ЧЕК (ПАРЯЩИЙ)
       ========================================= */
    function updateBar() {
        let totalEur = 0, count = 0; 
        let activeItems = [];
        
        // Собираем данные, сохраняя порядок очереди (cart)
        cart.forEach(item => {
            const dbItem = db.find(r => r.PZN === item.pzn);
            if (dbItem) {
                const p = Math.round(parseFloat(dbItem.Price.replace(',','.')));
                const sum = p * item.qty;
                totalEur += sum; count += item.qty;
                activeItems.push({ name: dbItem.Name_DE, p: p, q: item.qty, sum: sum });
            }
        });

        const bar = document.getElementById('miniCart');
        const receipt = document.getElementById('miniReceipt');
        
        if(count > 0) {
            const grandTotalEur = totalEur + shipEur;
            const grandTotalRub = getRubPrice(grandTotalEur);
            let displayItems = []; let hasHidden = false;
            
            if (activeItems.length <= 6) { 
                displayItems = activeItems.map((item, idx) => ({ ...item, num: idx + 1 })); 
            } else {
                // Первые 3 и Последние 2
                for(let i=0; i<3; i++) displayItems.push({ ...activeItems[i], num: i + 1 });
                hasHidden = true;
                for(let i=activeItems.length-2; i<activeItems.length; i++) displayItems.push({ ...activeItems[i], num: i + 1 });
            }

            let renderedRows = '';
            const generateRow = (item) => {
                // ВАЖНО: Тут логика "pack"
                const mathStr = item.q > 1 ? `${item.p}€ × ${item.q} pack =` : ``;
                return `
                <div class="receipt-row">
                    <span class="num">${item.num}.</span>
                    <span class="name">${item.name}</span>
                    <span class="dots"></span>
                    <span class="calc">${mathStr} <b>${item.sum}€</b></span>
                </div>`;
            };

            const firstPart = hasHidden ? displayItems.slice(0,3) : displayItems;
            firstPart.forEach(item => { renderedRows += generateRow(item); });

            if (hasHidden) {
                renderedRows += `<div class="receipt-row center">.......</div>`;
                const lastPart = displayItems.slice(3);
                lastPart.forEach(item => { renderedRows += generateRow(item); });
            }

            receipt.innerHTML = renderedRows + `
                <div class="receipt-divider"></div>
                <div class="receipt-row color-ship">
                    <span class="num"></span><span class="name">Почтовый тариф</span><span class="dots"></span><span class="calc">${shipEur} €</span>
                </div>
                <div class="receipt-row calc-line">Итого: ${grandTotalEur}€ × ${rateCalc.toFixed(2)}</div>
                
                <div class="receipt-row total-rub-line" style="justify-content: space-between; align-items: center;">
                    <span style="font-size: 10px; color: #777; font-weight: 500;">Нажмите для заказа</span>
                    <span>= ${grandTotalRub.toLocaleString()} ₽ ➔</span>
                </div>
            `;
            bar.classList.add('active');
            document.getElementById('miniCount').innerText = count;
            document.getElementById('miniPrice').innerText = grandTotalEur + ' €';
            receipt.style.display = 'flex';
        } else {
            bar.classList.remove('active'); receipt.style.display = 'none';
        }
    }

    /* =========================================
       BLOCK 7: МОДАЛЬНОЕ ОКНО ЗАКАЗА
       ========================================= */
    function openCart() { 
        const modal = document.getElementById('modal');
        const miniCart = document.getElementById('miniCart');
        miniCart.style.display = 'none';
        renderCartItems();
        modal.classList.add('active'); 
        setTimeout(() => { modal.classList.add('open'); }, 10);
    }

    function closeModal() { 
        const modal = document.getElementById('modal');
        const miniCart = document.getElementById('miniCart');
        const searchInput = document.getElementById('search');
        modal.classList.remove('open');
        setTimeout(() => {
            modal.classList.remove('active');
            miniCart.style.display = 'flex'; 
            updateBar(); 
        }, 300);
        searchInput.focus();
    }

    function renderCartItems() {
        const div = document.getElementById('cartItems'); div.innerHTML = '';
        let totalEur = 0;
        
        if (cart.length === 0) {
            div.innerHTML = '<div style="text-align:center; padding:20px; color:#999;">Корзина пуста</div>';
        } else {
            // ВАЖНО: Порядок 1:1 как в мини-чеке
            cart.forEach((item, index) => {
                const r = db.find(x => x.PZN === item.pzn);
                if (r) {
                    const q = item.qty;
                    const p = parseFloat(r.Price.replace(',','.'));
                    const sumEur = Math.round(p * q);
                    const sumRub = getRubPrice(sumEur);
                    totalEur += sumEur;
                    
                    div.innerHTML += `
                    <div class="m-row-interactive">
                        <div class="m-info">
                            <span class="m-num">${index + 1}.</span>
                            <div class="m-text">
                                <div class="m-name">${r.Name_DE}</div>
                                <div class="m-meta">${r.Hersteller}</div>
                            </div>
                        </div>
                        <div class="m-ctrl-block">
                             <div class="m-single-price">${Math.round(p)} €</div>
                             <div class="qty-capsule">
                                <button class="q-btn" onclick="modQty('${item.pzn}',-1, event)">−</button>
                                <span class="q-val">${q}</span>
                                <button class="q-btn" onclick="modQty('${item.pzn}',1, event)">+</button>
                            </div>
                            <div class="m-price-block">
                                <div class="m-eur">${sumEur} €</div>
                                <div class="m-sub-rub">${sumRub.toLocaleString()} ₽</div>
                            </div>
                        </div>
                    </div>`;
                }
            });
        }
        document.getElementById('summaryBox').innerHTML = `<div class="sum-line"><span>Итого:</span><b>${Math.round(totalEur + shipEur)} €</b></div><div class="sum-rub">${getRubPrice(totalEur + shipEur).toLocaleString()} ₽</div>`;
    }

    function doShare(type) {
        let text = "Заказ RXDE:\n", total = 0;
        cart.forEach(item => {
            const r = db.find(x => x.PZN === item.pzn);
            if (r) {
                const p = parseFloat(r.Price.replace(',','.'));
                text += `- ${r.Name_DE} (x${item.qty})\n`; 
                total += p * item.qty;
            }
        });
        text += `\nСумма: ${Math.round(total + shipEur)} EUR.`;
        const enc = encodeURIComponent(text);
        if(type === 'tg') window.open(`https://t.me/${TG_USER}?text=${enc}`);
        if(type === 'wa') window.open(`https://wa.me/${WA_PHONE}?text=${enc}`);
    }

    /* =========================================
       BLOCK 8: АНИМАЦИЯ
       ========================================= */
    function animateFly(startElement, isRemoving = false, productSize = 0) {
        const modal = document.getElementById('modal');
        const isModalOpen = modal.classList.contains('active');
        let target = isModalOpen ? document.getElementById('summaryBox') : document.getElementById('miniCart');

        playSound(isRemoving ? 'rem' : 'add');

        let sizeVal = parseInt(productSize) || 0; 
        let pillCount = 1;
        if (sizeVal > 90) pillCount = 3; else if (sizeVal > 50) pillCount = 2;

        const sRect = startElement.getBoundingClientRect();
        const tRect = target.getBoundingClientRect();

        for (let i = 0; i < pillCount; i++) {
            setTimeout(() => { createSinglePill(sRect, tRect, isRemoving); }, i * 120);
        }
    }

    function createSinglePill(sRect, tRect, isRemoving) {
        const fly = document.createElement('div');
        fly.className = 'fly-pill'; fly.innerText = '💊';
        if (isRemoving) fly.classList.add('removing');

        if (isRemoving) {
            fly.style.left = (tRect.left + tRect.width/2) + 'px'; fly.style.top = (tRect.top + tRect.height/2) + 'px'; fly.style.transform = 'scale(0.5)';
            document.body.appendChild(fly);
            setTimeout(() => { fly.style.left = (sRect.left + sRect.width/2) + 'px'; fly.style.top = (sRect.top + sRect.height/2) + 'px'; fly.style.transform = 'scale(1) rotate(-360deg)'; fly.style.opacity = '0.5'; }, 50);
            setTimeout(() => { fly.remove(); }, 900);
        } else {
            fly.style.left = (sRect.left + sRect.width/2) + 'px'; fly.style.top = (sRect.top + sRect.height/2) + 'px';
            document.body.appendChild(fly);
            setTimeout(() => { fly.style.left = (tRect.left + tRect.width/2) + 'px'; fly.style.top = (tRect.top + tRect.height/2) + 'px'; fly.style.transform = 'scale(0.1) rotate(360deg)'; fly.style.opacity = '0.5'; }, 50);
            setTimeout(() => { 
                const targetEl = document.getElementById(document.getElementById('modal').classList.contains('active') ? 'summaryBox' : 'miniCart');
                targetEl.classList.add('pulse'); 
            }, 600);
            setTimeout(() => { 
                const targetEl = document.getElementById(document.getElementById('modal').classList.contains('active') ? 'summaryBox' : 'miniCart');
                targetEl.classList.remove('pulse'); 
            }, 900);
            setTimeout(() => { fly.remove(); }, 600);
        }
    }

    /* =========================================
       BLOCK 9: ФУНКЦИИ АДМИНА (COPY)
       ========================================= */
    function copyForClient() {
        if (!filters.search) { 
            if (navigator.vibrate) navigator.vibrate(50); 
            return; 
        }

        const tokens = filters.search.toLowerCase().split(/\s+/).map(t => getTranslitVariations(t));
        const currentResults = db.filter(r => {
            if (!r.Name_DE) return false;
            const text = (r.Name_DE + ' ' + (r.Form||'') + ' ' + r.Hersteller + ' ' + r.PZN).toLowerCase();
            return tokens.every(vrs => vrs.some(v => text.includes(v)));
        });

        if (currentResults.length === 0) return;

        const dateNow = new Date().toLocaleDateString('ru-RU');
        
        let text = `[${dateNow}]\n`;
        text += `Курс евро расчетный: ${rateCalc.toFixed(2)}₽\n`;
        text += `Тариф почты из Германии до 5кг: ${shipEur}€\n\n`;

        if (currentResults[0].Substance) {
            text += `Действующее вещество: [${currentResults[0].Substance}]\n\n`;
        }

        currentResults.slice(0, 20).forEach((r, index) => {
            const priceEur = parseFloat(r.Price.replace(',','.'));
            const priceRub = getRubPrice(priceEur);
            
            // Красивый формат с пробелами
            text += `${index + 1}. ${r.Name_DE}, ${r.Hersteller}, PZN: ${r.PZN} ... ${Math.round(priceEur).toLocaleString()}€ (${priceRub.toLocaleString()}₽)\n\n`;
        });

        const link = window.location.href;
        text += `Ссылка для быстрого заказа:\n${link}`;

        navigator.clipboard.writeText(text).then(() => {
            const logo = document.querySelector('.embedded-logo');
            logo.style.transition = 'color 0.2s';
            logo.style.color = 'var(--ok)'; 
            setTimeout(() => { logo.style.color = ''; }, 400);
            
            if (navigator.vibrate) navigator.vibrate(100);
        }).catch(err => {
            console.error('Ошибка копирования', err);
        });
    }

    init();
</script>
</body>
</html>

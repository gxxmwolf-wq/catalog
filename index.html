<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>RXDE.online — Справочник</title>

    <meta property="og:title" content="RXDE.online">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

   

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

</head>

<body>



<div class="cont">

    <div class="top-row">

        <div class="slogan-top">Справочник лекарств</div>

        <div class="rates-top">€ ЦБ: <span id="cbRate">...</span> | Расчет: <span id="finalRate">...</span></div>

    </div>



    <div class="sticky" onclick="event.stopPropagation()">

        <div class="inp-wrap">

            <div class="embedded-logo">

                <span class="rx-part">RX</span>

                <span class="de-part">DE</span>

            </div>

            <input type="text" id="search" class="search-input" placeholder="Поиск (рус / lat)..." oninput="handleInput()" autocomplete="off">

            <span class="cls-btn" id="clearBtn" onclick="clearSearch()" style="display:none">✕</span>

        </div>

    </div>

   

    <div id="list"></div>

   

    <div id="introBlock" style="display:none; padding: 40px 10px; color:#555; line-height:1.6; font-size:15px;">

        <h2 style="color:#000; margin-top:0;">Deutsche Qualität.</h2>

        <p>Мы — сервис прямой доставки лекарств из немецких аптек.</p>

        <p>Введите название препарата, выберите количество и отправьте заказ.</p>

        <div style="margin-top:30px; border-left: 3px solid #005691; padding-left:15px; font-style:italic;">

            "Здоровье — это когда в аптеку ходишь только за витаминами."

        </div>

    </div>

</div>



<div class="cart-wrapper" onclick="event.stopPropagation()">

    <div id="floatBar" class="float-bar empty" onclick="openCart()">

        <span style="font-size:1rem; font-weight:500;">Корзина пуста</span>

    </div>

</div>



<div id="modal" class="modal" onclick="closeModal()">

    <div class="m-box" onclick="event.stopPropagation()">

        <h3 style="margin:0 0 15px 0; border-bottom: 2px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">

            <span>Ваш заказ</span>

            <span onclick="closeModal()" style="cursor:pointer; font-size:1.5rem; line-height:1;">✕</span>

        </h3>

       

        <div id="undoArea"></div>

        <div id="cartItems"></div>

        <div id="summaryBox" style="background:#f9f9f9; padding:15px; border-radius:10px; margin-top:15px;"></div>

       

        <div class="contact-grid">

            <button onclick="doShare('tg')" class="c-btn tg">Telegram</button>

            <button onclick="doShare('wa')" class="c-btn wa">WhatsApp</button>

            <button onclick="doShare('email')" class="c-btn em">Email</button>

        </div>

    </div>

</div>



<script>

    const LOCAL_DB_URL = 'db.csv';

    const GOOGLE_SETTINGS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTh9jBKA_RFbB03wt7VljCrZqxM9wBq9aGadw1uHCD4PQ5z5K3YoiF1bkxabc1kzPtP6tA6FLOxOB6b/pub?gid=23735297&single=true&output=csv';

    const CBR_API_URL = 'https://www.cbr-xml-daily.ru/daily_json.js';

    const KURS_FALLBACK = 100;

   

    const TG_USER = 'remed01';

    const WA_PHONE = '79650302556';

    const EMAIL_CONTACT = 'med.zakaz.de@gmail.com';



    let db = [], cart = {};

    let rateCalc = KURS_FALLBACK, shipEur = 50;

    let googleSettings = null, cbrRateData = 0;

    let filters = { search: '' };

    let isCartExpanded = false;



    function init() {

        try {

            const saved = localStorage.getItem('de_cart');

            if (saved) cart = JSON.parse(saved);

        } catch(e) { cart = {}; }



        fetchLocalDB().then(() => {

            calculateFinalLogic();

            Promise.all([fetchCbrRate(), fetchGoogleSettings()]).then(() => {

                calculateFinalLogic();

            });

        });

    }



    function fetchLocalDB() {

        return new Promise((resolve) => {

            const url = LOCAL_DB_URL + '?v=' + new Date().getTime();

            Papa.parse(url, {

                download: true, header: true, skipEmptyLines: true,

                complete: (res) => { db = res.data; resolve(); },

                error: (err) => { console.error(err); resolve(); }

            });

        });

    }



    function fetchGoogleSettings() {

        return new Promise((resolve) => {

            const url = GOOGLE_SETTINGS_URL + '&t=' + new Date().getTime();

            Papa.parse(url, {

                download: true, header: true, skipEmptyLines: true,

                complete: (res) => { if(res.data && res.data.length > 0) googleSettings = res.data[0]; resolve(); },

                error: (err) => { resolve(); }

            });

        });

    }



    async function fetchCbrRate() {

        try {

            const response = await fetch(CBR_API_URL);

            const data = await response.json();

            cbrRateData = data.Valute.EUR.Value;

        } catch (e) { cbrRateData = 0; }

    }



    function calculateFinalLogic() {

        if (!db || !Array.isArray(db) || db.length === 0) return;



        let gRate = 0, gSmena = 0, gMail = 0;

        if (googleSettings) {

            gRate = parseFloat(googleSettings.Current_Rate?.replace(',', '.') || 0);

            gSmena = parseFloat(googleSettings.Bank_Smena?.replace(',', '.') || 0);

            gMail = parseFloat(googleSettings.Mail_EURO?.replace(',', '.') || 0);

        }



        let baseRate = (gRate > 0) ? gRate : (cbrRateData > 0 ? cbrRateData : KURS_FALLBACK);

        rateCalc = baseRate + gSmena;

        shipEur = (gMail > 0) ? gMail : 50;



        const cbObj = document.getElementById('cbRate'); if(cbObj) cbObj.innerText = baseRate.toFixed(2);

        const finObj = document.getElementById('finalRate'); if(finObj) finObj.innerText = rateCalc.toFixed(2);

       

        updateBar();

        render();

    }



    function getRubPrice(eur) { return Math.floor((parseFloat(eur) * rateCalc) / 100) * 100; }



    function getTranslitVariations(word) {

        const ru2en = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya' };

        const en2ru = { 'a':'а','b':'б','v':'в','g':'г','d':'д','e':'е','z':'з','i':'и','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','r':'р','s':'с','t':'т','u':'у','f':'ф','h':'х','c':'ц','y':'ы','x':'х','w':'в' };

        const w = word.toLowerCase();

        let resRu = '', resEn = '';

        for(let char of w) { resEn += ru2en[char] || char; resRu += en2ru[char] || char; }

        return [w, resEn, resRu];

    }



    function handleInput() {

        const input = document.getElementById('search');

        filters.search = input.value.trim();

        document.getElementById('clearBtn').style.display = filters.search ? 'flex' : 'none';

        render();

    }

   

    function clearSearch() { document.getElementById('search').value = ''; handleInput(); }



    function render() {

        const list = document.getElementById('list');

        const intro = document.getElementById('introBlock');

        if(!list) return;

       

        list.innerHTML = '';

       

        let results = [];

        let mode = ''; // 'search', 'cart', 'intro'

        let hiddenCount = 0;



        if (filters.search) {

            mode = 'search';

            const searchParts = filters.search.toLowerCase().split(/\s+/);

            const searchTokens = searchParts.map(part => getTranslitVariations(part));

            results = db.filter(r => {

                if (!r.Name_DE) return false;

                const itemText = (r.Name_DE + ' ' + r.Hersteller + ' ' + r.Substance + ' ' + r.PZN + ' ' + (r.Name_RU||'') + ' ' + (r.Substance_RU||'')).toLowerCase();

                return searchTokens.every(variations => { return variations.some(v => itemText.includes(v)); });

            });

        }

        else if (Object.keys(cart).length > 0) {

            mode = 'cart';

            // В списке показываем только активные (qty > 0)

            results = db.filter(r => cart.hasOwnProperty(r.PZN) && cart[r.PZN] > 0);

           

            const totalItems = results.length;

            const PREVIEW_LIMIT = 4;



            if (totalItems > 0) {

                list.innerHTML = `<div style="padding:15px 0 10px 0; display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid #eee; margin-bottom:5px;">

                    <span style="font-weight:bold; color:#005691; text-transform:uppercase; font-size:11px; letter-spacing:1px;">Ваш список (${totalItems}):</span>

                    ${totalItems > PREVIEW_LIMIT ? `<span onclick="toggleCartExpand()" style="font-size:11px; color:#222; text-decoration:underline; cursor:pointer;">${isCartExpanded ? 'Свернуть' : 'Развернуть'}</span>` : ''}

                </div>`;



                if (totalItems > PREVIEW_LIMIT && !isCartExpanded) {

                    hiddenCount = totalItems - PREVIEW_LIMIT;

                    results = results.slice(0, PREVIEW_LIMIT);

                }

            } else {

                mode = 'intro';

            }

        }

        else {

            mode = 'intro';

        }



        if (intro) {

            if (mode === 'intro') {

                intro.style.display = 'block';

                list.style.display = 'none';

                return;

            } else {

                intro.style.display = 'none';

                list.style.display = 'block';

            }

        }



        if (results.length === 0 && mode === 'search') {

            list.innerHTML = `<div class="empty-state" style="padding:40px 0; text-align:center; color:#999;">Ничего не найдено</div>`;

            return;

        }



        const MAX_ITEMS = 60;

        results.slice(0, MAX_ITEMS).forEach(r => {

            const unitPriceEur = parseFloat(r.Price.toString().replace(',','.'));

            const q = cart[r.PZN] || 0;

            const badgeRx = (r.R && r.R !== "0" && !r.R.toLowerCase().includes("no")) ? `<span class="badge-rx">RX</span>` : '';

            const metaParts = [r.Form, r.Hersteller, `PZN: ${r.PZN}`].filter(Boolean).join(' | ');

            const unitHtml = `<div class="price-unit-box">${Math.round(unitPriceEur)} €</div>`;

           

            let btnsHtml = '';

            // КНОПКИ С ЗАЩИТОЙ (event.stopPropagation)

            if (q > 0) {

                btnsHtml = `

                <div class="qty-segment">

                    <button class="seg-btn minus" onclick="event.stopPropagation(); modQty('${r.PZN}',-1)">−</button>

                    <div class="seg-val">${q}</div>

                    <button class="seg-btn plus" onclick="event.stopPropagation(); modQty('${r.PZN}',1)">+</button>

                </div>`;

            } else {

                btnsHtml = `

                <div class="qty-segment">

                    <button class="seg-btn full-width" onclick="event.stopPropagation(); modQty('${r.PZN}',1)">+</button>

                </div>`;

            }



            let totalHtml = '';

            if (q > 0) {

                const lineTotal = Math.round(unitPriceEur * q);

                const lineTotalRub = getRubPrice(lineTotal);

                totalHtml = `

                <div class="price-total-box">

                    <div class="total-eur">${lineTotal} €</div>

                    <div class="total-rub">${lineTotalRub.toLocaleString()} ₽</div>

                </div>

                <div class="del-math" onclick="event.stopPropagation(); modQty('${r.PZN}', 0)">×</div>`;

            } else {

                totalHtml = `<div class="price-total-box"></div><div class="del-math" style="visibility:hidden">×</div>`;

            }



            list.innerHTML += `

            <div class="card ${q > 0 ? 'selected-item' : ''}">

                <div class="card-main">

                    <div class="card-title">${r.Name_DE} ${badgeRx}</div>

                    <div class="meta-line">${metaParts}</div>

                </div>

                <div class="card-actions">

                    ${unitHtml}

                    <div class="qty-ctrl">${btnsHtml}</div>

                    ${totalHtml}

                </div>

            </div>`;

        });



        if (hiddenCount > 0 && mode === 'cart') {

            list.innerHTML += `

            <div onclick="toggleCartExpand()" style="text-align: center; padding: 15px; color: #555; font-size: 13px; font-weight: 500; cursor: pointer; background: #f9f9f9; border-radius: 8px; margin-top: 10px; border: 1px dashed #ccc;">

                ⬇️ Показать еще ${hiddenCount} позиций...

            </div>`;

        }

    }



    function toggleCartExpand() { isCartExpanded = !isCartExpanded; render(); }



    function modQty(pzn, d) {

        let current = cart[pzn] || 0;

        let next = current + d;

        if (next < 0) next = 0;



        const isCartOpen = document.getElementById('modal').style.display === 'flex';



        if (d === 0) {

            delete cart[pzn];

        } else if (next === 0) {

            if (isCartOpen) {

                cart[pzn] = 0; // В корзине - призрак

            } else {

                delete cart[pzn]; // В списке - удаление

            }

        } else {

            cart[pzn] = next;

        }

       

        saveAndRefresh();

    }



    function hardDelete(pzn) {

        delete cart[pzn];

        saveAndRefresh();

    }



    function restoreItem(pzn) {

        cart[pzn] = 1;

        saveAndRefresh();

    }



    function saveAndRefresh() {

        localStorage.setItem('de_cart', JSON.stringify(cart));

        updateBar();

        render();

        if(document.getElementById('modal').style.display === 'flex') {

            renderCartItems();

        }

    }



    function closeModal() {

        document.getElementById('modal').style.display = 'none';

        let cleaned = false;

        // Удаляем призраков при закрытии

        for (const pzn in cart) {

            if (cart[pzn] === 0) {

                delete cart[pzn];

                cleaned = true;

            }

        }

        if(cleaned) {

            localStorage.setItem('de_cart', JSON.stringify(cart));

            updateBar();

            render();

        }

    }



    function renderCartItems() {

        const div = document.getElementById('cartItems');

        div.innerHTML = '';

        document.getElementById('undoArea').innerHTML = '';



        let totalEur = 0;

        let itemCounter = 1;



        // Стили кнопок (дублируем inline для надежности)

        const segStyle = `display:flex; width:100%; height:32px; background:#eff3f6; border-radius:8px; overflow:hidden;`;

        const btnStyle = `border:none; background:transparent; width:30px; cursor:pointer; font-weight:bold; font-size:18px; display:flex; align-items:center; justify-content:center; padding:0; color:#333;`;

        const valStyle = `flex:1; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;`;



        db.forEach(r => {

            if(cart.hasOwnProperty(r.PZN)) {

                const qty = cart[r.PZN];

                const unitPriceEur = parseFloat(r.Price.toString().replace(',','.'));

                const lineTotal = Math.round(unitPriceEur * qty);

                const lineTotalRub = getRubPrice(lineTotal);

               

                if (qty > 0) totalEur += lineTotal;



                const metaParts = [r.Form, r.Hersteller, `PZN: ${r.PZN}`].filter(Boolean).join(' | ');



                if (qty > 0) {

                    // АКТИВНЫЙ (Добавлен stopPropagation)

                    div.innerHTML += `

                    <div class="card" style="padding: 10px 0; border-bottom:1px dashed #ddd;">

                        <div class="card-main" style="flex:1; padding-right:5px; padding-left:5px;">

                            <div class="card-title">

                                <span style="font-size:12px; color:#999; font-weight:bold; margin-right:5px;">${itemCounter++}.</span>

                                ${r.Name_DE}

                            </div>

                            <div class="meta-line" style="margin-left:20px;">${metaParts}</div>

                        </div>

                        <div class="card-actions" style="width:210px; min-width:210px;">

                            <div class="price-unit-box">${Math.round(unitPriceEur)} €</div>

                            <div class="qty-ctrl" style="width:90px;">

                                <div style="${segStyle}">

                                    <button onclick="event.stopPropagation(); modQty('${r.PZN}',-1)" style="${btnStyle}">−</button>

                                    <div style="${valStyle}">${qty}</div>

                                    <button onclick="event.stopPropagation(); modQty('${r.PZN}',1)" style="${btnStyle}">+</button>

                                </div>

                            </div>

                            <div class="price-total-box">

                                <div class="total-eur">${lineTotal} €</div>

                                <div class="total-rub">${lineTotalRub.toLocaleString()} ₽</div>

                            </div>

                        </div>

                    </div>`;

                } else {

                    // ПРИЗРАК (Добавлен stopPropagation)

                    div.innerHTML += `

                    <div class="cart-row deleted" style="display:flex; justify-content:space-between; align-items:center; padding:12px 0;">

                        <div style="width:20px;"></div>

                        <div style="flex:1; padding-right:10px;">

                            <div class="text-deleted">${r.Name_DE}</div>

                            <div class="meta-deleted">${metaParts}</div>

                        </div>

                        <div class="card-actions" style="width:210px; min-width:210px;">

                            <div class="restore-actions">

                                <button class="btn-restore" onclick="event.stopPropagation(); restoreItem('${r.PZN}')">🛒</button>

                                <button class="btn-purge" onclick="event.stopPropagation(); hardDelete('${r.PZN}')">⛔</button>

                            </div>

                        </div>

                    </div>`;

                }

            }

        });



        const grandEur = Math.round(totalEur + shipEur);

        const grandRub = getRubPrice(grandEur);

       

        const sBox = document.getElementById('summaryBox');

        if(sBox) {

            sBox.innerHTML = `

            <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>Товары:</span> <b>${Math.round(totalEur)} €</b></div>

            <div style="display:flex; justify-content:space-between; margin-bottom:10px; color:#555;"><span>Доставка:</span> <b>+${shipEur} €</b></div>

            <div style="display:flex; justify-content:space-between; font-size:1.2rem; font-weight:900; border-top:1px solid #ddd; padding-top:10px;"><span>ИТОГО:</span> <span>${grandEur} €</span></div>

            <div style="text-align:right; font-size:0.9rem; color:#005691; font-weight:bold;">${grandRub.toLocaleString()} ₽</div>`;

        }

    }



    function updateBar() {

        let totalEur = 0, count = 0;

        if(Array.isArray(db)) {

            db.forEach(r => {

                if(cart.hasOwnProperty(r.PZN) && cart[r.PZN] > 0) {

                    const safePrice = parseFloat(r.Price.toString().replace(',','.'));

                    totalEur += safePrice * cart[r.PZN];

                    count += cart[r.PZN];

                }

            });

        }

        const totalRub = getRubPrice(totalEur);

        const floatBar = document.getElementById('floatBar');

       

        if(count > 0) {

            floatBar.classList.remove('empty');

            floatBar.innerHTML = `

                <div id="barTotal" style="line-height:1.1; text-align:left;">

                    <div style="font-size:1.2rem; font-weight:800;">${Math.round(totalEur)} €</div>

                    <div style="font-size:0.75rem; opacity:0.9; font-weight:500;">${totalRub.toLocaleString()} ₽</div>

                </div>

                <span style="background:rgba(255,255,255,0.2); padding:8px 16px; border-radius:30px; font-weight:bold; font-size:0.9rem; letter-spacing:0.5px;">Оформить ➝</span>

             `;

        } else {

            floatBar.classList.add('empty');

            floatBar.innerHTML = `<span style="font-size:1rem; font-weight:500;">Корзина пуста</span>`;

        }

    }



    function openCart() { document.getElementById('modal').style.display = 'flex'; renderCartItems(); }

   

    function doShare(type) {

         let text = "Заказ RXDE:\n";

         let total = 0;

         db.forEach(r => {

             if(cart.hasOwnProperty(r.PZN) && cart[r.PZN] > 0) {

                 text += `- ${r.Name_DE} (x${cart[r.PZN]})\n`;

                 total += parseFloat(r.Price.replace(',','.')) * cart[r.PZN];

             }

         });

         text += `\nСумма: ${Math.round(total)} EUR (+ доставка).`;

         const enc = encodeURIComponent(text);

         if(type === 'tg') window.open(`https://t.me/${TG_USER}?text=${enc}`);

         if(type === 'wa') window.open(`https://wa.me/${WA_PHONE}?text=${enc}`);

         if(type === 'email') window.location.href = `mailto:${EMAIL_CONTACT}?subject=Заказ&body=${enc}`;

    }



    init();

</script>

</body>

</html>
